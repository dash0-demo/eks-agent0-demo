apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels: { app: storefront }
spec:
  replicas: 1
  selector:
    matchLabels: { app: storefront }
  template:
    metadata:
      labels:
        app: storefront
        app.kubernetes.io/name: storefront
        app.kubernetes.io/part-of: shop
    spec:
      containers:
        - name: storefront
          image: node:22-slim
          command: ["node", "/app/server.js"]
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: storefront
            - name: INVENTORY_URL
              value: http://inventory:8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: storefront-code
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
spec:
  selector: { app: storefront }
  ports:
    - port: 8080
      targetPort: 8080

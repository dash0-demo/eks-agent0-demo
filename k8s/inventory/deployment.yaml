apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  labels: { app: inventory }
spec:
  replicas: 1
  selector:
    matchLabels: { app: inventory }
  template:
    metadata:
      labels:
        app: inventory
        app.kubernetes.io/name: inventory
        app.kubernetes.io/part-of: shop
    spec:
      containers:
        - name: inventory
          image: node:22-slim
          command: ["node", "/app/server.js"]
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: inventory
            # Stock report cache. Raised for the holiday sale.
            # The cache lives in process memory, so the memory limit below must
            # stay above CACHE_SIZE_MB plus ~100Mi for the Node.js runtime.
            - name: CACHE_SIZE_MB
              value: "512"
          resources:
            requests:
              cpu: 100m
              memory: 640Mi
            limits:
              memory: 768Mi
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: inventory-code
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
spec:
  selector: { app: inventory }
  ports:
    - port: 8080
      targetPort: 8080

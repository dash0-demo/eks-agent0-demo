apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  labels: { app: inventory }
spec:
  replicas: 1
  selector:
    matchLabels: { app: inventory }
  template:
    metadata:
      labels: { app: inventory }
    spec:
      containers:
        - name: inventory
          image: node:22-slim
          command: ["node", "/app/server.js"]
          ports:
            - containerPort: 8080
          env:
            # Stock report cache. Raised for the holiday sale.
            - name: CACHE_SIZE_MB
              value: "512"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: inventory-code
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
spec:
  selector: { app: inventory }
  ports:
    - port: 8080
      targetPort: 8080
